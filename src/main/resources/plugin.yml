name: CdrBounty
version: 0.6.0
main: store.cadera.cdrbounty.CdrBountyPlugin
api-version: '1.21'
author: CADERA
description: NPC-driven bounty contracts with approval, tracking, reputation auto-bounties, and quest integration for Paper 1.21.11.
depend: [Vault, Citizens]
softdepend: [CdrReputation, BetonQuest, CdrQuestJournal]

commands:
  cdrbounty:
    description: CdrBounty administration command.
    usage: /cdrbounty <approval|reload|add|remove|inspect|history|debug|npc>
    permission: cdrbounty.admin

permissions:
  cdrbounty.contract.create:
    default: true
  cdrbounty.contract.accept:
    default: true
  cdrbounty.contract.abandon:
    default: true
  cdrbounty.contract.private:
    default: true
  cdrbounty.contract.anonymous:
    default: true
  cdrbounty.contract.exclusive:
    default: true
  cdrbounty.admin:
    default: op
    children:
      cdrbounty.admin.reload: true
      cdrbounty.admin.modify: true
      cdrbounty.admin.inspect: true
      cdrbounty.admin.debug: true
      cdrbounty.admin.contracts: true
      cdrbounty.admin.npc: true
      cdrbounty.admin.approval: true
  cdrbounty.admin.reload:
    default: op
  cdrbounty.admin.modify:
    default: op
  cdrbounty.admin.inspect:
    default: op
  cdrbounty.admin.debug:
    default: op
  cdrbounty.admin.contracts:
    default: op
  cdrbounty.admin.npc:
    default: op
  cdrbounty.admin.approval:
    default: op
  cdrbounty.bypass.antifarm:
    default: op
