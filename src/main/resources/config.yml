config-version: 9

economy:
  minimum-bounty: 100.00
  maximum-bounty: 100000000.00
  placement-fee-percent: 2.5
  decimal-scale: 2

placement:
  allow-self-bounty: false
  allow-offline-targets: true
  stacking-enabled: true
  minimum-playtime-seconds: 0
  maximum-active-bounty-per-target: 100000000.00
  duration-seconds: 604800
  blacklisted-worlds: []

contract:
  max-active-per-hunter: 3
  public-reservation-limit: 8
  sync-seconds: 30

npc:
  input-timeout-seconds: 60
  click-cooldown-millis: 600

tracking:
  update-seconds: 20
  pause-scan-seconds: 5
  pause-worlds:
    - lobby
  accuracy:
    close-max-distance: 300
    medium-max-distance: 1000
    far-max-distance: 2000
    close-offset: 25
    medium-offset: 50
    far-offset: 80
    very-far-offset: 120

reputation-auto-bounty:
  enabled: true
  announce: true
  reset-threshold: -500
  tiers:
    outlaw:
      threshold: -1000
      add-bounty: "25000.00"
    infamous:
      threshold: -2000
      add-bounty: "25000.00"
    public-enemy:
      threshold: -3500
      add-bounty: "50000.00"

shop-integration:
  enabled: true
  refresh-seconds: 3
  tiers:
    low:
      minimum-bounty: "10000.00"
      buy-multiplier: 1.10
    medium:
      minimum-bounty: "50000.00"
      buy-multiplier: 1.25
    high:
      minimum-bounty: "100000.00"
      buy-multiplier: 1.50
    extreme:
      minimum-bounty: "500000.00"
      buy-multiplier: 2.00

claim:
  blacklisted-worlds: []
  killer-victim-cooldown-seconds: 3600
  repeated-pair-window-seconds: 86400
  repeated-pair-max-claims: 2
  same-ip-policy: BLOCK
  # Optional anti-alt gates. Keep 0 to disable.
  minimum-hunter-playtime-seconds: 0
  minimum-target-playtime-seconds: 0
  minimum-survival-after-claim-seconds: 300

refund:
  on-expire: FULL
  on-admin-cancel: FULL

runtime:
  expiration-scan-seconds: 30
  debug: false
