name: Build CdrBounty

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: mvn -B --no-transfer-progress clean verify

      - name: Validate plugin jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/CdrBounty-0.2.2-beta.2.jar"
          test -f "$JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -qx 'plugin.yml' jar-contents.txt
          grep -qx 'config.yml' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/contract/ContractService.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/contract/SQLiteContractRepository.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/claim/ContractClaimService.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/contract/ContractGuiService.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/npc/BountyNpcService.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/npc/BountyNpcBindingService.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/npc/BountyPlacementWizard.class' jar-contents.txt
          unzip -p "$JAR" plugin.yml > packaged-plugin.yml
          unzip -p "$JAR" config.yml > packaged-config.yml
          grep -q '^version: 0.2.2-beta.2$' packaged-plugin.yml
          grep -q '^depend: \[Vault, Citizens\]' packaged-plugin.yml
          grep -q '^npc:$' packaged-config.yml
          grep -q '^  input-timeout-seconds: 60$' packaged-config.yml
          if grep -q '^  bounty:' packaged-plugin.yml; then
            echo 'Player /bounty command must not be registered in NPC-only mode.' >&2
            exit 1
          fi

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CdrBounty-0.2.2-beta.2
          path: target/CdrBounty-0.2.2-beta.2.jar
          if-no-files-found: error
