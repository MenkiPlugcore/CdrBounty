name: Build CdrBounty

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: mvn -B --no-transfer-progress clean verify

      - name: Validate plugin jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/CdrBounty-0.2.0-beta.2.jar"
          test -f "$JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -qx 'plugin.yml' jar-contents.txt
          grep -qx 'config.yml' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/contract/ContractService.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/contract/SQLiteContractRepository.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/claim/ContractClaimService.class' jar-contents.txt

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CdrBounty-beta2
          path: target/CdrBounty-0.2.0-beta.2.jar
          if-no-files-found: error
