name: Build CdrBounty

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: mvn -B --no-transfer-progress clean test package

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CdrBounty-beta1
          path: target/CdrBounty-*.jar
          if-no-files-found: error
