name: Build CdrBounty

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: mvn -B --no-transfer-progress clean verify

      - name: Validate plugin jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/CdrBounty-0.7.0.jar"
          test -f "$JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -qx 'plugin.yml' jar-contents.txt
          grep -qx 'config.yml' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/api/CdrBountyShopApi.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/shop/WantedShopService.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/quest/QuestBountyService.class' jar-contents.txt
          grep -q 'store/cadera/cdrbounty/tracking/BountyTrackerService.class' jar-contents.txt
          unzip -p "$JAR" plugin.yml > packaged-plugin.yml
          unzip -p "$JAR" config.yml > packaged-config.yml
          grep -q '^version: 0.7.0$' packaged-plugin.yml
          grep -q '^shop-integration:$' packaged-config.yml
          grep -q '^  refresh-seconds: 3$' packaged-config.yml
          if grep -q '^  bounty:' packaged-plugin.yml; then
            echo 'Player /bounty command must not be registered.' >&2
            exit 1
          fi

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CdrBounty-0.7.0
          path: target/CdrBounty-0.7.0.jar
          if-no-files-found: error
